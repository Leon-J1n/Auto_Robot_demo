name: LinearMove
version: "2.0"

description: Parameters specific to the Linear Move Path Strategy.

input:
  linear_search_mode:
    type: string
    enum: [fast, exhaustive]
    default: fast
    description: Fast tries the current branch before searching alternatives; exhaustive compares all branches.
  cartesian_step:
    type: float
    unit: meter
    range: [0.0001, 0.1]
    default: 0.02

  orientation_mode:
    type: string
    default: fixed
    enum: [fixed, interpolate, target_only]

  direction:
    type: object
    description: Optional direction for relative Cartesian motion.
    properties:
      frame: {type: string, default: tool}
      x: {type: float}
      y: {type: float}
      z: {type: float}

  distance:
    type: float
    unit: meter
    description: Required when direction is provided.

  max_joint_step:
    type: float
    unit: radian
    range: [0.001, 0.4]
    default: 0.4
    description: Maximum per-joint change between Cartesian IK samples, including the measured start.

  min_path_fraction:
    type: float
    range: [0.0, 1.0]
    default: 0.98

validation_rules:
  - when: direction is provided
    require: [distance]
